[project]
name = "creditlab"
version = "0.1.0"
description = "Loan-level mortgage PD modeling on real Fannie Mae data, stress-tested through the 2008 crisis"
requires-python = ">=3.11"
# Data layer (loader, labels, features, metrics) is deliberately stdlib-only;
# numpy/scikit-learn exist solely to FIT the logistic baseline (inference is
# plain arithmetic on the extracted artifact). lightgbm arrives with milestone 5
# as an optional extra.
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Reference challenger backend; without it train_gbm falls back to sklearn's
# HistGradientBoostingClassifier. macOS additionally needs: brew install libomp
gbm = ["lightgbm>=4.7"]

[project.scripts]
creditlab = "creditlab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["creditlab"]
