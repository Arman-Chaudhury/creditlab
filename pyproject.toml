[project]
name = "creditlab"
version = "0.1.0"
description = "Loan-level mortgage PD modeling on real Fannie Mae data, stress-tested through the 2008 crisis"
requires-python = ">=3.11"
# The loader and fixture generator are deliberately stdlib-only.
# Modeling dependencies (numpy, scikit-learn, lightgbm) arrive with milestones 4-5.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["creditlab"]
